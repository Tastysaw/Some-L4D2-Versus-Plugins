// 开启插件
l4d2_rocktrail_enable "1"

// 谁能看到轨迹
// 0=所有人, 1=特感和观察
// 2=仅观察, 3=仅特感
l4d2_rocktrail_team "1"

// 轨迹颜色
l4d2_rocktrail_color "255 0 255"

// 透明度
l4d2_rocktrail_alpha "255"

// 持续时间
l4d2_rocktrail_life "2.0"

// 起始与结束宽度
l4d2_rocktrail_width "10.0"
l4d2_rocktrail_endwidth "10.0"

// 渐变长度
l4d2_rocktrail_fade "5"

// 0=激光, 1=柔和
l4d2_rocktrail_material "0"
