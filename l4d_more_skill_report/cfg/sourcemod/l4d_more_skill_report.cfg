// 放到 cfg/sourcemod/l4d_more_skill_report.cfg
// 0=关闭播报，1=开启播报。单项开关不修改游戏伤害或技巧判定。

l4d_more_skill_report_enable "1"

// Charger 一撞多（至少 2 人）
l4d_more_skill_report_charger_impact "1"

// 坦克一铁压（至少 1 人）
l4d_more_skill_report_tank_hittable "1"

// 坦克一拍多（至少 2 人）
l4d_more_skill_report_tank_punch "1"

// 坦克石头命中生还者，显示出手到命中的直线距离
l4d_more_skill_report_tank_rock_hit "1"

// Boomer 一吐多（至少 2 人）
l4d_more_skill_report_boomer_vomit "1"

// Boomer 一炸多（至少 2 人）
l4d_more_skill_report_boomer_explode "1"

// 特感多控（至少 2 人）
l4d_more_skill_report_multi_cap "1"

// 秒杀 Witch，显示伤害
l4d_more_skill_report_witch_crown "1"

// 引秒 Witch，显示初始/最终伤害
l4d_more_skill_report_witch_drawcrown "1"

// 推停 Jockey
l4d_more_skill_report_jockey_air_shove "1"

// 打碎坦克石头，显示打碎时生还者与投掷坦克间的直线距离
l4d_more_skill_report_tank_rock_break "1"

// 距离显示一位小数；默认按 1 Source 单位=1 英寸换算，1 单位=0.0254 米。
// 这是显示比例，可根据服务器习惯修改。
l4d_more_skill_report_meters_per_unit "0.0254"

// 引秒最后一发霰弹的最低有效伤害。沿用原插件变量名。
sm_witch_drawcrown_damage "500"

// 快速击杀Spitter
l4d_more_skill_report_spitter_quick "1"

// Spitter 酸液点燃汽油桶
l4d_more_skill_report_spitter_oil "1"

// 生还者从仍在活动的酸液中运走汽油桶，显示时间及数量
l4d_more_skill_report_gascan_save "1"

// 生还者直接打爆汽油桶
l4d_more_skill_report_gascan_break "1"

// 连续独自击杀四个不同普通特感；队友不能伤害，已击杀者不能进入灵魂状态
l4d_more_skill_report_solo_four "1"

// 快速击杀阈值，单位秒，严格小于该值。
l4d_more_skill_report_spitter_quick_seconds "5.0"
// 1=首次接近生还者起计时（默认）；0=实际现身起计时。
l4d_more_skill_report_spitter_quick_mode "1"
// 模式 1 的接近距离，Source 单位；300 单位按默认比例约为 7.6 米。
l4d_more_skill_report_spitter_near_range "300.0"
// 救油检测按酸液各活动单元计算；以下为几何容差，单位均为 Source 单位。
l4d_more_skill_report_acid_cell_radius "48.0"
l4d_more_skill_report_acid_height "72.0"
