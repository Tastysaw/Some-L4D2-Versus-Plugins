// 尸潮事件生成CI数量预告

//开启插件
l4d2_horde_counter_enable "1"

//尸潮事件开始时是否播报
l4d2_horde_counter_announce_start "1"

//尸潮事件结束时是否播报
l4d2_horde_counter_announce_end "1"

//尸潮事件判定结束的事件，多少秒内没有尸潮事件即判定尸潮结束
l4d2_horde_counter_quiet_time "12.0"

// 判定警报车尸潮的时间，即玩家打响警报车后多少秒触发的尸潮事件将被判定为警报车尸潮
l4d2_horde_counter_alarm_window "8.0"

// debug用
l4d2_horde_counter_debug "0"
